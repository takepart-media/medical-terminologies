# Production compose file. Run with: docker compose -f compose.prod.yaml up -d
# The app container loads Laravel config from .env via env_file. The environment block below
# only overrides values that differ when running inside the docker network (DB_HOST=db etc.)
# or that control the serversideup/php image's autorun behavior.
#
# Required entries in .env (see .env.example): APP_KEY, APP_URL, DB_DATABASE, DB_USERNAME,
# DB_PASSWORD, ELASTIC_PASSWORD. APP_PORT and ES_HEAP_SIZE are optional.
#
# ELASTIC_PASSWORD is embedded as basic auth into ELASTIC_HOST — URL-encode @ : / # ? if used.

services:
    mt-app:
        container_name: mt-app
        build:
            context: .
            dockerfile: Dockerfile.prod
        restart: unless-stopped
        ports:
            - '${APP_PORT:-80}:8080'
        env_file:
            - .env
        environment:
            DB_HOST: mt-db
            DB_PORT: ${DB_PORT:-5432}
            SCOUT_DRIVER: elastic
            ELASTIC_HOST: http://elastic:${ELASTIC_PASSWORD}@mt-elasticsearch:9200
            AUTORUN_ENABLED: true
            AUTORUN_LARAVEL_ROUTE_CACHE: true
            PHP_OPCACHE_ENABLE: 1
            PHP_MEMORY_LIMIT: 1024M
        depends_on:
            mt-db:
                condition: service_healthy
            mt-elasticsearch:
                condition: service_healthy

    mt-worker:
        container_name: mt-worker
        build:
            context: .
            dockerfile: Dockerfile.prod
        restart: unless-stopped
        # entrypoint bypasses the image's nginx+php-fpm s6 stack so the container
        # runs a single queue worker process. --max-time recycles the worker hourly
        # to avoid long-running memory growth (restart policy brings it right back).
        entrypoint: [ 'php', 'artisan' ]
        command: [ 'queue:work', '--tries=3', '--max-time=3600', '--sleep=3' ]
        env_file:
            - .env
        environment:
            DB_HOST: mt-db
            DB_PORT: ${DB_PORT:-5432}
            SCOUT_DRIVER: elastic
            ELASTIC_HOST: http://elastic:${ELASTIC_PASSWORD}@mt-elasticsearch:9200
        depends_on:
            mt-db:
                condition: service_healthy
            mt-elasticsearch:
                condition: service_healthy

    mt-db:
        container_name: mt-db
        image: postgres:17-alpine
        restart: unless-stopped
        # Port intentionally not published — mt-db is only reachable from the compose network.
        # `command: -p` makes postgres listen on a non-default port so multiple postgres
        # services can coexist on the same docker network with distinct DB_PORT values.
        command: -p ${DB_PORT:-5432}
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - mt-db-data:/var/lib/postgresql/data
        healthcheck:
            test: [ 'CMD-SHELL', 'pg_isready -p ${DB_PORT:-5432} -U $${POSTGRES_USER} -d $${POSTGRES_DB}' ]
            interval: 5s
            timeout: 5s
            retries: 10

    mt-elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
        container_name: mt-elasticsearch
        restart: unless-stopped
        # Port intentionally not published — ES is only reachable from the compose network.
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=true
            - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
            - ES_JAVA_OPTS=-Xms${ES_HEAP_SIZE:-1g} -Xmx${ES_HEAP_SIZE:-1g}
            - bootstrap.memory_lock=true
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
        volumes:
            - mt-es-data:/usr/share/elasticsearch/data
        healthcheck:
            test: [ 'CMD-SHELL', 'curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE ''"status":"(green|yellow)"'' || exit 1' ]
            interval: 10s
            timeout: 5s
            retries: 10

volumes:
    mt-db-data:
    mt-es-data:
        driver: local
